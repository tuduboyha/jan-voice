<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Jan Voice</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div data-include="partials/header.html"></div>

<main class="site-main">
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-card glass-card">
            <h1>Choose a New Password</h1>
            <form class="auth-form" id="resetForm">
                <label>New Password
                    <input type="password" name="password" required minlength="8" placeholder="At least 8 characters">
                </label>
                <label>Confirm New Password
                    <input type="password" name="confirm_password" required minlength="8" placeholder="Re-enter password">
                </label>
                <button type="submit" class="btn btn-gradient btn-block">Reset Password</button>
            </form>
        </div>
    </div>
</section>
</main>
<div data-include="partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/include.js"></script>
<script src="assets/js/common.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = e.target.password.value;
    const confirm = e.target.confirm_password.value;
    if (password !== confirm) {
        window.jv.showToast('Passwords do not match.', 'error');
        return;
    }
    const { error } = await window.jv.supabase.auth.updateUser({ password });
    if (error) {
        window.jv.showToast(error.message, 'error');
    } else {
        window.jv.showToast('Password updated. Please log in.', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    }
});
</script>
</body>
</html>
