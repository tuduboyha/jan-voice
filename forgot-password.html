<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Jan Voice</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div data-include="partials/header.html"></div>

<main class="site-main">
<section class="auth-section">
    <div class="container auth-container">
        <div class="auth-card glass-card">
            <h1>Reset Your Password</h1>
            <p class="auth-subtitle">Enter your account email and we'll send you a reset link.</p>

            <form class="auth-form" id="forgotForm">
                <label>Email
                    <input type="email" name="email" required placeholder="you@example.com">
                </label>
                <button type="submit" class="btn btn-gradient btn-block">Send Reset Link</button>
            </form>

            <p class="auth-switch"><a href="login.html">Back to login</a></p>
        </div>
    </div>
</section>
</main>
<div data-include="partials/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/include.js"></script>
<script src="assets/js/common.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = e.target.email.value.trim().toLowerCase();
    const redirectTo = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');
    const { error } = await window.jv.supabase.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) {
        window.jv.showToast(error.message, 'error');
    } else {
        window.jv.showToast('If an account exists with that email, a reset link has been sent.', 'success');
    }
});
</script>
</body>
</html>
